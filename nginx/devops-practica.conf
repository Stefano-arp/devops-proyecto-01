# Install as /etc/nginx/conf.d/devops-practica.conf (Debian/Ubuntu nginx).
# The stock sites-enabled/default must be disabled by the operator first: this
# server owns the default listener on port 80. Do not put nginx in Docker.
server {
    listen 80 default_server;
    server_name _;

    include /opt/devops-practica/nginx/active.conf;

    location / {
        # Lets deployment verify that a new nginx worker serves the new slot.
        add_header X-Devops-Slot $devops_slot always;
        proxy_pass $devops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
